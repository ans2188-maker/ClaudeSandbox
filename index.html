<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Scoreboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a0aec0;
      margin-bottom: 2rem;
    }

    .scoreboard {
      display: flex;
      align-items: stretch;
      gap: 2rem;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #16213e;
      border-radius: 1rem;
      padding: 2rem 2.5rem;
      min-width: 220px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .team-name {
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #90cdf4;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .score {
      font-size: 6rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1.5rem;
      min-width: 3ch;
      text-align: center;
      color: #f7fafc;
    }

    .controls {
      display: flex;
      gap: 1rem;
    }

    button {
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: 700;
      width: 3rem;
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.93);
    }

    .btn-plus {
      background: #2b6cb0;
      color: #fff;
    }

    .btn-plus:hover {
      background: #3182ce;
    }

    .btn-minus {
      background: #2d3748;
      color: #a0aec0;
    }

    .btn-minus:hover {
      background: #4a5568;
      color: #e2e8f0;
    }

    .divider {
      display: flex;
      align-items: center;
      font-size: 2.5rem;
      font-weight: 300;
      color: #4a5568;
      padding: 0 0.5rem;
    }

    .reset-wrap {
      margin-top: 2.5rem;
    }

    .btn-reset {
      background: #742a2a;
      color: #fed7d7;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      width: auto;
      padding: 0 1.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
    }

    .btn-reset:hover {
      background: #9b2c2c;
    }
  </style>
</head>
<body>
  <h1>Volleyball Scoreboard</h1>

  <div class="scoreboard">
    <div class="team">
      <div class="team-name">Team A</div>
      <div class="score" id="score-a">0</div>
      <div class="controls">
        <button class="btn-minus" onclick="adjust('a', -1)">−</button>
        <button class="btn-plus" onclick="adjust('a', +1)">+</button>
      </div>
    </div>

    <div class="divider">:</div>

    <div class="team">
      <div class="team-name">Team B</div>
      <div class="score" id="score-b">0</div>
      <div class="controls">
        <button class="btn-minus" onclick="adjust('b', -1)">−</button>
        <button class="btn-plus" onclick="adjust('b', +1)">+</button>
      </div>
    </div>
  </div>

  <div class="reset-wrap">
    <button class="btn-reset" onclick="reset()">Reset</button>
  </div>

  <script>
    const scores = { a: 0, b: 0 };

    function adjust(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      document.getElementById('score-' + team).textContent = scores[team];
    }

    function reset() {
      scores.a = 0;
      scores.b = 0;
      document.getElementById('score-a').textContent = '0';
      document.getElementById('score-b').textContent = '0';
    }
  </script>
</body>
</html>
