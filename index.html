<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Scoreboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 1rem;
    }

    h1 {
      font-size: clamp(0.9rem, 3.5vw, 1.5rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a0aec0;
      margin-bottom: clamp(1rem, 3vh, 2rem);
      text-align: center;
    }

    .scoreboard {
      display: flex;
      align-items: stretch;
      gap: clamp(0.75rem, 3vw, 2rem);
      width: 100%;
      max-width: 600px;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #16213e;
      border-radius: 1rem;
      padding: clamp(1rem, 3vw, 2rem) clamp(0.75rem, 3vw, 2.5rem);
      flex: 1;
      min-width: 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .team-name {
      font-size: clamp(0.8rem, 3vw, 1.1rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #90cdf4;
      margin-bottom: clamp(0.75rem, 2vh, 1.5rem);
      font-weight: 600;
    }

    .score-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3.5rem, 13vw, 6rem);
      font-weight: 700;
      line-height: 1;
      width: 100%;
      height: clamp(90px, 22vw, 140px);
      border-radius: 0.75rem;
      cursor: pointer;
      user-select: none;
      color: #f7fafc;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .score-box::before,
    .score-box::after {
      content: '';
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .score-box::before {
      left: 0;
      background: radial-gradient(circle at 30% 50%, rgba(160,100,100,0.35), transparent 70%);
    }

    .score-box::after {
      right: 0;
      background: radial-gradient(circle at 70% 50%, rgba(100,160,100,0.35), transparent 70%);
    }

    .score-box:active::before,
    .score-box.flash-minus::before {
      opacity: 1;
    }

    .score-box.flash-plus::after {
      opacity: 1;
    }

    .score-hint {
      font-size: clamp(0.55rem, 2vw, 0.7rem);
      letter-spacing: 0.08em;
      color: #4a5568;
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 0.25rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    button {
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.93);
    }

    .divider {
      display: flex;
      align-items: center;
      font-size: 2.5rem;
      font-weight: 300;
      color: #4a5568;
      padding: 0 0.5rem;
    }

    .reset-wrap {
      margin-top: clamp(1.25rem, 3vh, 2.5rem);
    }

    .btn-reset {
      background: #742a2a;
      color: #fed7d7;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      width: auto;
      padding: 0 1.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
    }

    .btn-reset:hover {
      background: #9b2c2c;
    }
  </style>
</head>
<body>
  <h1>Volleyball Scoreboard</h1>

  <div class="scoreboard">
    <div class="team">
      <div class="team-name">Team A</div>
      <div class="score-box" id="score-a" onclick="handleTap(event, 'a')">0</div>
      <div class="score-hint"><span>− tap left</span><span>tap right +</span></div>
    </div>

    <div class="divider">:</div>

    <div class="team">
      <div class="team-name">Team B</div>
      <div class="score-box" id="score-b" onclick="handleTap(event, 'b')">0</div>
      <div class="score-hint"><span>− tap left</span><span>tap right +</span></div>
    </div>
  </div>

  <div class="reset-wrap">
    <button class="btn-reset" onclick="reset()">Reset</button>
  </div>

  <script>
    const scores = { a: 0, b: 0 };

    function handleTap(e, team) {
      const box = e.currentTarget;
      const isRight = e.offsetX >= box.offsetWidth / 2;
      adjust(team, isRight ? 1 : -1);
      const cls = isRight ? 'flash-plus' : 'flash-minus';
      box.classList.add(cls);
      setTimeout(() => box.classList.remove(cls), 200);
    }

    function adjust(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      document.getElementById('score-' + team).textContent = scores[team];
    }

    function reset() {
      scores.a = 0;
      scores.b = 0;
      document.getElementById('score-a').textContent = '0';
      document.getElementById('score-b').textContent = '0';
    }

    // Keep screen awake while the scoreboard is open
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (_) {}
    }

    // Re-acquire after the page becomes visible again (e.g. tab switch)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    requestWakeLock();
  </script>
</body>
</html>
