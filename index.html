<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Lets "Add to Home Screen" open the page without browser chrome (iPhone has no fullscreen API) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#8f2418" />
  <title>Volleyball Scoreboard</title>
  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #8f2418;
      --ink: #ffffff;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Segoe UI', sans-serif;
      color: var(--ink);
      padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right))
               max(0.75rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
      overflow: hidden;
    }

    .scoreboard {
      display: flex;
      align-items: stretch;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    .score-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Digits are sized from this box (see .score-num), so they always fit inside it */
      container-type: size;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      width: 100%;
      flex: 1;
      min-height: 0;
      border-radius: 0.75rem;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
    }

    .score-num {
      font-size: clamp(4rem, min(28vw, 40vh), 30rem);
      font-size: min(120cqh, 72cqw);
      pointer-events: none;
    }

    .score-box::before,
    .score-box::after {
      content: '';
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .score-box::before {
      left: 0;
      background: radial-gradient(circle at 30% 50%, rgba(0,0,0,0.35), transparent 70%);
    }

    .score-box::after {
      right: 0;
      background: radial-gradient(circle at 70% 50%, rgba(255,255,255,0.45), transparent 70%);
    }

    .score-box:active::before,
    .score-box.flash-minus::before {
      opacity: 1;
    }

    .score-box.flash-plus::after {
      opacity: 1;
    }

    .tap-hint {
      font-size: 0.75rem;
      white-space: nowrap;
      letter-spacing: 0.1em;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.75;
    }

    button {
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.93);
    }

    .divider {
      display: flex;
      align-items: center;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      padding: 0 0.5rem;
    }

    /* Upright phone: stack the scores so each gets the full width */
    @media (orientation: portrait) {
      .scoreboard { flex-direction: column; }
      .divider { display: none; }
    }

    .reset-wrap {
      display: flex;
      align-items: center;
      gap: clamp(0.75rem, 4vw, 1.5rem);
      margin-top: 0.25rem;
      white-space: nowrap;
    }

    .btn-reset {
      background: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.5rem;
      opacity: 0.75;
    }

    .btn-reset:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="scoreboard">
    <div class="team">
      <div class="score-box" onclick="handleTap(event, 'a')"><span class="score-num" id="score-a">0</span></div>
    </div>

    <div class="divider">:</div>

    <div class="team">
      <div class="score-box" onclick="handleTap(event, 'b')"><span class="score-num" id="score-b">0</span></div>
    </div>
  </div>

  <div class="reset-wrap">
    <span class="tap-hint">Tap left −  ·  right +</span>
    <button class="btn-reset" onclick="reset()">Reset</button>
  </div>

  <script>
    const saved = JSON.parse(localStorage.getItem('vb-scores') || 'null');
    const scores = saved || { a: 0, b: 0 };

    document.getElementById('score-a').textContent = scores.a;
    document.getElementById('score-b').textContent = scores.b;

    function save() {
      localStorage.setItem('vb-scores', JSON.stringify(scores));
    }

    function handleTap(e, team) {
      enableNoSleep();
      const box = e.currentTarget;
      const isRight = e.offsetX >= box.offsetWidth / 2;
      adjust(team, isRight ? 1 : -1);
      const cls = isRight ? 'flash-plus' : 'flash-minus';
      box.classList.add(cls);
      setTimeout(() => box.classList.remove(cls), 200);
    }

    function adjust(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      document.getElementById('score-' + team).textContent = scores[team];
      save();
    }

    function reset() {
      scores.a = 0;
      scores.b = 0;
      document.getElementById('score-a').textContent = '0';
      document.getElementById('score-b').textContent = '0';
      save();
    }

    // Keep screen awake — uses Wake Lock API where available, falls back
    // to a hidden looping video for browsers that don't support it (e.g. DuckDuckGo on iOS)
    let noSleep;
    try { noSleep = new NoSleep(); } catch (_) {}

    function enableNoSleep() {
      if (noSleep) noSleep.enable().catch(() => {});
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') enableNoSleep();
    });
  </script>
</body>
</html>
