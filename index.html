<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Lets "Add to Home Screen" open the page without browser chrome (iPhone has no fullscreen API) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#8f2418" />
  <title>Volleyball Scoreboard</title>
  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #8f2418;
      --ink: #ffffff;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Segoe UI', sans-serif;
      color: var(--ink);
      padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right))
               max(0.75rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
      overflow: hidden;
    }

    h1 {
      font-size: clamp(0.9rem, 3.5vw, 1.5rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: clamp(0.5rem, 2vh, 1.5rem);
      text-align: center;
    }

    .scoreboard {
      display: flex;
      align-items: stretch;
      gap: clamp(0.5rem, 2vw, 1.5rem);
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: clamp(3px, 0.6vw, 6px) solid var(--ink);
      border-radius: 1rem;
      padding: clamp(0.5rem, 2vw, 1.25rem);
      flex: 1;
      min-width: 0;
    }

    .team-name {
      font-size: clamp(1rem, 4vw, 2rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: clamp(0.25rem, 1vh, 0.75rem);
      font-weight: 800;
    }

    .score-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(4rem, min(28vw, 55vh), 30rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      width: 100%;
      flex: 1;
      min-height: 0;
      border-radius: 0.75rem;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .score-box::before,
    .score-box::after {
      content: '';
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .score-box::before {
      left: 0;
      background: radial-gradient(circle at 30% 50%, rgba(0,0,0,0.35), transparent 70%);
    }

    .score-box::after {
      right: 0;
      background: radial-gradient(circle at 70% 50%, rgba(255,255,255,0.45), transparent 70%);
    }

    .score-box:active::before,
    .score-box.flash-minus::before {
      opacity: 1;
    }

    .score-box.flash-plus::after {
      opacity: 1;
    }

    .score-hint {
      font-size: clamp(0.6rem, 2vw, 1rem);
      white-space: nowrap;
      letter-spacing: 0.08em;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 0.25rem;
      text-transform: uppercase;
    }

    button {
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.93);
    }

    .divider {
      display: flex;
      align-items: center;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      padding: 0 0.5rem;
    }

    .reset-wrap {
      display: flex;
      gap: 1rem;
      margin-top: clamp(0.5rem, 2vh, 1.5rem);
    }

    .btn-reset {
      background: var(--ink);
      color: var(--bg);
      font-weight: 700;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      width: auto;
      padding: 0 1.5rem;
      height: 2.75rem;
      border-radius: 0.5rem;
    }

    .btn-reset:hover {
      background: #f3d6d2;
    }

    .fs-tip {
      position: fixed;
      left: 50%;
      bottom: 4.5rem;
      transform: translateX(-50%);
      max-width: 90vw;
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Volleyball Scoreboard</h1>

  <div class="scoreboard">
    <div class="team">
      <div class="team-name">Team A</div>
      <div class="score-box" id="score-a" onclick="handleTap(event, 'a')">0</div>
      <div class="score-hint"><span>− left</span><span>right +</span></div>
    </div>

    <div class="divider">:</div>

    <div class="team">
      <div class="team-name">Team B</div>
      <div class="score-box" id="score-b" onclick="handleTap(event, 'b')">0</div>
      <div class="score-hint"><span>− left</span><span>right +</span></div>
    </div>
  </div>

  <div class="reset-wrap">
    <button class="btn-reset" onclick="reset()">Reset</button>
    <button class="btn-reset" id="btn-fs" onclick="toggleFullscreen()">Full Screen</button>
  </div>

  <div class="fs-tip" id="fs-tip">This browser can't go full screen. Use Share → Add to Home Screen, then open it from there.</div>

  <script>
    const saved = JSON.parse(localStorage.getItem('vb-scores') || 'null');
    const scores = saved || { a: 0, b: 0 };

    document.getElementById('score-a').textContent = scores.a;
    document.getElementById('score-b').textContent = scores.b;

    function save() {
      localStorage.setItem('vb-scores', JSON.stringify(scores));
    }

    function handleTap(e, team) {
      enableNoSleep();
      const box = e.currentTarget;
      const isRight = e.offsetX >= box.offsetWidth / 2;
      adjust(team, isRight ? 1 : -1);
      const cls = isRight ? 'flash-plus' : 'flash-minus';
      box.classList.add(cls);
      setTimeout(() => box.classList.remove(cls), 200);
    }

    function adjust(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      document.getElementById('score-' + team).textContent = scores[team];
      save();
    }

    function reset() {
      scores.a = 0;
      scores.b = 0;
      document.getElementById('score-a').textContent = '0';
      document.getElementById('score-b').textContent = '0';
      save();
    }

    const root = document.documentElement;
    const fsBtn = document.getElementById('btn-fs');
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;

    // Already launched from the home screen: there's no browser UI to hide
    if (isStandalone) fsBtn.style.display = 'none';

    function toggleFullscreen() {
      enableNoSleep();
      if (fsElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (root.requestFullscreen) {
        root.requestFullscreen().catch(showFsTip);
      } else if (root.webkitRequestFullscreen) {
        root.webkitRequestFullscreen();
      } else {
        showFsTip();
      }
    }

    function showFsTip() {
      const tip = document.getElementById('fs-tip');
      tip.style.display = 'block';
      setTimeout(() => tip.style.display = 'none', 5000);
    }

    function updateFsButton() {
      fsBtn.textContent = fsElement() ? 'Exit Full Screen' : 'Full Screen';
    }
    document.addEventListener('fullscreenchange', updateFsButton);
    document.addEventListener('webkitfullscreenchange', updateFsButton);

    // Keep screen awake — uses Wake Lock API where available, falls back
    // to a hidden looping video for browsers that don't support it (e.g. DuckDuckGo on iOS)
    let noSleep;
    try { noSleep = new NoSleep(); } catch (_) {}

    function enableNoSleep() {
      if (noSleep) noSleep.enable().catch(() => {});
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') enableNoSleep();
    });
  </script>
</body>
</html>
